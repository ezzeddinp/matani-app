project_id = "matani-app"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "http://localhost:8081"
additional_redirect_urls = ["mataniapp://auth/callback"]

[storage]
enabled = true
file_size_limit = "10MiB"
