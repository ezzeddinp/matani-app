name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  fixture-first:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: supabase/setup-cli@v1
        with:
          version: 2.110.0
      - run: npm ci
      - run: npm ci --prefix backend
      - run: npx expo config --type public
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://fixture.invalid
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: fixture-publishable-key
          GOOGLE_MAPS_API_KEY_IOS: fixture-map-key
          GOOGLE_MAPS_API_KEY_ANDROID: fixture-map-key
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run test:backend
      - run: python -m unittest discover -s research/tests -p "test_*.py"
      - run: supabase start
      - run: supabase db reset
      - run: supabase db reset
      - run: supabase test db
      - run: supabase db lint --schema public --level error
      - run: node scripts/generate-db-types.mjs
      - run: git diff --exit-code -- supabase/types/database.types.ts
